name: Maven Build

on:
  workflow_dispatch:
  push:
    branches: [jedison-1.1.1-SNAPSHOT]
  pull_request:
    branches: [jedison-1.1.1-SNAPSHOT]

permissions:
  contents: read

concurrency:
  group: maven-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java-version: ['8', '11', '21', '25']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Build and verify Java 8-targeted library
        run: mvn -B -ntp clean verify
